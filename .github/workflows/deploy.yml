name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test lib

  ota:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Publish Expo OTA update
        if: env.EXPO_TOKEN != ''
        run: npx --yes eas-cli@22.4.0 update --auto --environment production --non-interactive
      - name: Skip OTA (EXPO_TOKEN missing)
        if: env.EXPO_TOKEN == ''
        run: echo "::notice title=OTA skipped::Set the EXPO_TOKEN repository secret to publish OTA updates."

  web:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Deploy web to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run cf:deploy:prod
      - name: Skip web deploy (CLOUDFLARE_API_TOKEN missing)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Web deploy skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
